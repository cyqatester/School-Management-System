<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>School Portal Login</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>

<body class="login">
    <main class="login-card">
        <div class="logo">S</div>
        <p class="eyebrow">SCHOOL MANAGEMENT v1.0 by cyqatester</p>
        <h1>Welcome back</h1>
        <p class="muted">Sign in to your school portal.</p>
        <p class="error" th:if="${param.error}">Invalid username or password.</p>
        <p class="success" th:if="${param.logout}">You are logged out.</p>
        <form th:action="@{/login}" method="post"><label>Username<input name="username" required
                    autofocus></label><label>Password<input type="password" name="password"
                    required></label><button>Sign in</button></form>
        <p class="hint">Demo login: superadmin / ChangeMe123!</p>
        <p class="hint">Change the initial password after first login.</p>
    </main>
</body>

</html>
